# Pekael look: dark navy and grey blue, light periwinkle tint (Sprint 4, D-38).
# Fonts, wordmark and motion are in src/pekael/ui/theme.py.
[theme]
base = "dark"
primaryColor = "#C8D7FF"
backgroundColor = "#0A1222"
secondaryBackgroundColor = "#111C31"
textColor = "#E7ECF4"
borderColor = "#22324F"

[server]
# Same limit as PDF_MAX_UPLOAD_MB (admin upload)
maxUploadSize = 30

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
